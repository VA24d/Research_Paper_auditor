[project]
name = "research-paper-auditor"
version = "0.1.0"
description = "Evidence-gated verification agent for auditing research paper submissions"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28,<1",
    "langchain-core>=1.6,<2",
    "langgraph>=1.2,<2",
    "pydantic>=2.12,<3",
    "pydantic-settings>=2.10,<3",
]

[dependency-groups]
dev = [
    "mypy>=2.4",
    "pre-commit>=4.3",
    "pytest>=9.0",
    "pytest-asyncio>=1.2",
    "ruff>=0.17",
]

[build-system]
requires = ["uv_build>=0.9,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "auditor"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
preview = true
explicit-preview-rules = true
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "UP",
    "SIM",
    "C4",
    "PT",
    "PTH",
    "RUF",
    "N",
    "ASYNC",
    "DTZ",
    "TID",
    "PLW1514",
]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--import-mode=importlib",
    "-m",
    "not grobid and not network and not llm",
]
xfail_strict = true
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "grobid: needs a running GROBID service (see compose.yaml)",
    "network: makes real requests to external APIs",
    "llm: calls a real LLM provider and costs tokens",
]
